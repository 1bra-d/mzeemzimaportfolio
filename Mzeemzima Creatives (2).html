/* Layout: sticky bar, hero with an editing-timeline motif, work grid fed by the owner dashboard, skills by category, footer contact. Dark navy single look carried over from the existing site. */
:root{
  --bg:#0b0f1d; --bg2:#121832; --bg3:#182042; --line:#252e55;
  --fg:#eef0fa; --mute:#99a1c4; --accent:#ff7a45; --accent-ink:#1c0c04;

}
*{box-sizing:border-box}

.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:72px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.h2{font-size:clamp(30px,5vw,48px);font-weight:700;margin-top:12px;letter-spacing:-.02em}
.lead{color:var(--mute);max-width:60ch;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 14px var(--body);text-decoration:none;cursor:pointer}

:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

function val(id){var e=document.getElementById(id);return e?e.value.trim():''}

function renderDash(){
  var host=document.getElementById('dash');host.replaceChildren();
  if(!ui.dash||!canEdit){host.hidden=true;document.documentElement.style.overflow='';return}
  host.hidden=false;document.documentElement.style.overflow='hidden';
  var top=h('div',{class:'dash-top'},h('div',{class:'in'},
    h('h2',{text:'Dashboard'}),
    h('button',{class:'btn sm',text:'Close',onclick:function(){ui.dash=false;ui.editId=null;ui.media=null;renderDash()}})));
  var tabs=h('div',{class:'in'},h('div',{class:'tabs',role:'tablist'},
    [['works','Works ('+S.works.length+')'],['skills','Skills ('+S.skills.length+')']].map(function(t){
      return h('button',{role:'tab','aria-selected':String(ui.tab===t[0]),text:t[1],onclick:function(){ui.tab=t[0];ui.editId=null;ui.media=null;ui.err='';renderDash()}})})));
  var body=ui.tab==='works'?worksPanel():skillsPanel();
  host.append(top,tabs,h('div',{class:'in'},body));
}

    pv.append(h('div',{class:'pv'},cur.type==='video'?h('video',{src:s,controls:true,preload:'metadata'}):h('img',{src:s,alt:'Preview'})),
      h('button',{class:'btn sm',style:'margin-top:8px',type:'button',text:'Remove media',onclick:function(){cur=null;ui.media=false;drawPv()}}))}

      var f=e.target.files[0];if(!f)return;

      try{var r=await assets.upload(f);
        cur={id:r.id,url:r.url,type:/^video\//.test(r.contentType)?'video':'image'};ui.media=cur;st.textContent='Uploaded.';drawPv();

  var form=h('div',{class:'panel'},h('h3',{text:ed?'Edit work':'Add a work'}),
    field('wtitle','Title',h('input',{id:'wtitle',type:'text',value:ed?ed.title:'',maxlength:'80',autocomplete:'off'})),
    h('div',{class:'row2'},
      field('wcat','Category',catSelect('wcat',CATS,ed?ed.cat:CATS[0])),
      field('wdate','Date finished',h('input',{id:'wdate',type:'date',value:ed?ed.date:today()}))),
    field('wdesc','Description',h('textarea',{id:'wdesc',maxlength:'400',text:ed?ed.desc:''})),
    field('wlink','Project link (optional)',h('input',{id:'wlink',type:'url',placeholder:'https://',value:ed?ed.link:''})),
    field('wtags','Skills used (comma separated)',h('input',{id:'wtags',type:'text',value:ed?(ed.tags||[]).join(', '):'',placeholder:'Premiere Pro, Colour grade'})),
    h('div',{class:'f'},h('label',{for:'wfile',text:'Image or video (max 20 MB)'}),fileIn,h('span',{id:'wstat',class:'hint'}),pv),
    h('div',{id:'werr',class:'err',text:ui.err}),
    h('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
      h('button',{class:'btn pri',type:'button',text:ed?'Save changes':'Add work',onclick:function(){
        var title=val('wtitle');if(!title){ui.err='Give the work a title.';document.getElementById('werr').textContent=ui.err;return}
        var raw=val('wlink'),link=raw?safeLink(raw):'';
        if(raw&&!link){document.getElementById('werr').textContent='The link must start with https://';return}
        var w={id:ed?ed.id:uid('w'),title:title,cat:val('wcat'),date:val('wdate'),desc:val('wdesc'),link:link,
          tags:val('wtags').split(',').map(function(t){return t.trim()}).filter(Boolean).slice(0,10),media:cur?{id:cur.id,url:cur.url,type:cur.type}:null};
        if(ed)S.works=S.works.map(function(x){return x.id===ed.id?w:x});else S.works.unshift(w);
        ui.editId=null;ui.media=null;ui.err='';changed(ed?'Work updated.':'Work added.');
      }}),
      ed?h('button',{class:'btn',type:'button',text:'Cancel',onclick:function(){ui.editId=null;ui.media=null;ui.err='';renderDash()}}):null));

      h('div',{class:'bt'},
        h('button',{class:'btn sm',text:'Edit',onclick:function(){ui.editId=w.id;ui.media=null;ui.confirm=null;ui.err='';renderDash();document.getElementById('dash').scrollTo(0,0)}}),
        h('button',{class:'btn sm danger',text:armed?'Confirm delete':'Delete',onclick:function(){

/* ---------- save bar + publish ---------- */
function changed(msg){dirty++;renderSite();renderDash();renderSave();if(msg)toast(msg)}
function renderSave(){
  var host=document.getElementById('save');host.replaceChildren();
  if(!canEdit||!dirty)return;
  host.append(h('div',{class:'savebar'},h('div',{class:'in'},
    h('span',{text:dirty+(dirty===1?' unpublished change':' unpublished changes')}),
    h('button',{class:'btn pri',disabled:ui.busy,text:ui.busy?'Publishing…':'Publish changes',onclick:publish}))));
}
function buildDoc(){
  var parts=[];
  Array.prototype.forEach.call(document.querySelectorAll('link[data-keep]'),function(l){parts.push(l.outerHTML)});
  var json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +document.querySelector('title').outerHTML
    +document.querySelector('meta[name="claude:viewport-fit-sides"]').outerHTML
    +parts.join('')
    +document.getElementById('css').outerHTML
    +'<div id="app"></div><script type="application/json" id="state">'+json+CLOSE
    +'<script id="code">'+document.getElementById('code').textContent+CLOSE+'</body></html>';
}
async function publish(){
  var art=await claude.use('artifact');
  if(!art){toast('Saving is not available in this view.');return}
  ui.busy=true;renderSave();
  try{await art.publish(buildDoc());toast('Published. Reloading…')}
  catch(e){ui.busy=false;renderSave();
    var c=e&&e.code;
    if(c==='conflict')return;
    toast(c==='not_writer'||c==='not_granted'?'Only the owner can publish changes.':c==='rate_limited'?'Too many saves. Wait a moment and try again.':c==='too_large'?'The page is too large to save.':'Could not publish. Try again.');}
}

renderBar();renderSite();
(async function(){
  try{var u=await claude.use('user');canEdit=!!(u&&await u.canEdit())}catch(e){canEdit=false}
  try{assets=canEdit?await claude.use('assets'):null}catch(e){assets=null}
  renderBar();renderSave();
})();
})();
